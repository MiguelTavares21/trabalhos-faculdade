networks:
  stockerapp:

services:
  stockerdb:
    container_name: StockerDB
    image: mcr.microsoft.com/mssql/server:2019-latest
    ports:
        - 8002:1433
    environment:
        - ACCEPT_EULA=Y
        - MSSQL_SA_PASSWORD=StockerBD!
    networks:
        - stockerapp
    volumes:
        - mssql_data:/var/opt/mssql
  stockerapi:
    container_name: StockerAPI
    image: ${DOCKER_REGISTRY-}stockerapi
    build:
      context: .
      dockerfile: StockerAPI/Dockerfile
    ports:
        - 8001:80
    depends_on:
        - stockerdb
    environment:
        - DB_HOST=stockerdb
        - DB_NAME=StockerAPI
        - DB_SA_PASSWORD=StockerDB!
    networks:
        - stockerapp
volumes:
  mssql_data: {}
