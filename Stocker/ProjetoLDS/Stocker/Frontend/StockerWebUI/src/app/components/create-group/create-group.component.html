<app-alerts [alerts]="alerts" (alertClosed)="removeAlert($event)"></app-alerts>

<div class="create-group">
  <button (click)="close()" class="close">X</button>
  <form
    id="createGroupForm"
    (ngSubmit)="onCreateGroup()"
    [formGroup]="createGroupForm"
    class="form-box"
  >
    <div class="title-box">
      <h2 class="text">CRIAR GRUPO</h2>
    </div>

    <div class="content">
      <label for="name">NOME DO GRUPO</label>
        <input
          type="text"
          formControlName="name"
          class="form-control"
          id="name"
          required
        />

      <label for="description">DESCRIÇÃO (opcional)</label>
        <input
          formControlName="description"
          class="form-control"
          id="description"
        />

      <label for="budget">ORÇAMENTO</label>
        <input
          type="number"
          formControlName="budget"
          class="form-control"
          id="budget"
          required
          min="0.01"
          step="0.01"
        />

      <div class="buttons">
        <button type="submit" class="btn-submit">
          Criar Grupo
        </button>
      </div>
    </div>
  </form>
</div>
