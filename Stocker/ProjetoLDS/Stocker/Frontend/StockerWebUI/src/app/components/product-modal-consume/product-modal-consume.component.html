<div class="modal-overlay" (click)="closeModal()">
  <div class="modal-container" (click)="stopPropagation($event)">
    <h2 class="modal-title">Alterar Quantidade</h2>

    <form [formGroup]="consumeProductForm" (ngSubmit)="onSubmit()">
      <div class="modal-body">
        <label for="quantity">Quantidade:</label>
        <input
          type="number"
          id="quantity"
          formControlName="quantity"
          class="form-control"
          [class.is-invalid]="
            consumeProductForm.get('quantity')?.invalid &&
            consumeProductForm.get('quantity')?.touched
          "
        />
        <div
          *ngIf="
            consumeProductForm.get('quantity')?.invalid &&
            consumeProductForm.get('quantity')?.touched
          "
          class="invalid-feedback"
        >
          Quantidade é obrigatória e deve ser maior ou igual a 0.
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn-save"
        type="submit">Guardar</button>
        <button class="btn-cancel" type="button" (click)="closeModal()">
          Cancelar
        </button>
      </div>
    </form>
  </div>
</div>
