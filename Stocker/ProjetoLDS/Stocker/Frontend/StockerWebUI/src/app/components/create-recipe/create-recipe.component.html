<div class="modal-overlay">
    <div class="alerts-container">
        <app-alerts [alerts]="alerts" (alertClosed)="removeAlert($event)"></app-alerts>
    </div>
    <div class="modal-content" (click)="$event.stopPropagation()">
        <h2>Criar Receita</h2>
        <button (click)="closePopup()" class="close">X</button>

        <div class="create-recipe">
            <form id="createRecipeForm" (ngSubmit)="onCreateRecipe()" [formGroup]="createRecipeForm" class="form-box">

                <div class="content">
                    <div class="recipeName">
                        <label for="name">Nome da receita</label>
                        <div class="input-container">
                            <input type="text" formControlName="name" class="form-control" id="name" required />
                        </div>
                    </div>
                    <div class="buttons">
                        <button type="submit" class="btn-submit">
                            Criar Receita
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
